n src)\nPYEOF", "Bash=cd /Users/apple/WeChatProjects/miniprogram-3 && python3 -c \"\nimport json\nd = json.load(open('miniprogram/app.json'))\nprint('pages:', d['pages'])\nprint('tabBar:', json.dumps(d.get('tabBar', {}), ensure_ascii=False))\nprint('subpackages:', json.dumps(d.get('subpackages', []), ensure_ascii=False))\n\""]
