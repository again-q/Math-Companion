,'loading','empty']),\n    ('pages/summary/summary', ['lastUpdatedText','empty','scope','learningDays','totalSessions','totalMessages','topicsCount','knowledgeCount','suggestionsCount','loading','refreshing','summary','fromCache','topicsExpanded']),\n]\n\nfor path, expected in pages:\n    js = open(f'miniprogram/{path}.js', encoding='utf-8').read()\n    wxml = open(f'miniprogram/{path}.wxml', encoding='utf-8').read()\n    # 提取 wxml 顶层绑定 {{xxx}} 和 item.xxx\n    top_level = set(re.findall(r'\\{\\{\\s*([a-zA-Z_]\\w*)', wxml))\n    item_fields = set(re.findall(r'item\\.([a-zA-Z_]\\w*)', wxml))\n    # js 里 setData 的键 + data 初始键\n    js_keys = set(re.findall(r'([a-zA-Z_]\\w*)\\s*:', js))\n    \n    missing_in_js = []\n    for f in expected:\n        # 字段是否在 js 的 data/setData 中（粗略：js 里出现该名字）\n        if f not in js_keys and not re.search(r'\\b' + f + r'\\b', js):\n            missing_in_js.append(f)\n    \n    print(f'=== {path} ===')\n    print(f'  wxml 顶层绑定: {sorted(top_level)}')\n    print(f'  wxml item 字段: {sorted(item_fields)}')\n    if missing_in_js:\n        print(f'  ❌ js 缺失字段: {missing_in_js}')\n    else:\n        print(f'  ✅ js/wxml 字段一致')\n    print()\nPYEOF", "Bash=cd /Users/apple/WeChatProjects/miniprogram-3 && python3 - <<'PYEOF'\nimport re, glob\n# 找 wxml 里 {{...?...:...?...:...}} 嵌套三元模式（含 ? 和 : 各 ≥2）\nfor f in glob.glob('miniprogram/pages/**/*.wxml', recursive=True):\n    src = open(f, encoding='utf-8').read()\n    for m in re.finditer(r'\\{\\{([^{}]*)\\}\\}', src):\n        expr = m.group(1)\n        if expr.count('?') >= 2 and expr.count(':') >= 2:\n            # 排除 ? : 在字符串里的情况（粗略）\n            print(f'{f}: {expr[:100]}')\nprint('扫描完成')\nPYEOF", "Bash=cd /Users/apple/WeChatProjects/miniprogram-3 && node -e \"\nconst parse = require('./miniprogram/towxml/parse/index.js');\ntry {\n  const nodes = parse('# 学习总结\\n\\n## 📅 学习概况\\n- 学习 14 天\\n- 方程 $x^2-4=0$ 的解是 \\$x=\\\\\\\\pm 2\\$\\n\\n**加粗** 和 *斜体*\\n\\n| a | b |\\n|---|---|\\n| 1 | 2 |', { theme: 'light' });\n  console.log('✅ 解析成功, keys:', Object.keys(nodes));\n  console.log('children 数:', nodes.children.length);\n  console.log('首节点:', JSON.stringify(nodes.children[0]).slice(0,150));\n} catch(e) {\n  console.log('❌ 解析失败:', e.message);\n}\n\"", "Bash=cd /Users/apple/WeChatProjects/miniprogram-3 && python3 - <<'PYEOF'\n# 1. config.js markdown 数组加 latex\np = 'miniprogram/towxml/config.js'\ns = open(p, encoding='utf-8').read()\ns = s.replace(\"\"\"        'emoji',                    // emoji表情支持\n        'todo'                      // todo支持\n    ],\"\"\", \"\"\"        'emoji',                    // emoji表情支持\n        'todo',                     // todo支持\n        'latex'                     // 数学公式支持\n    ],\"\"\")\nopen(p, 'w', encoding='utf-8').write(s)\nprint('config.js 已加 latex')\n\n# 2. parse/markdown/index.js 放开插件加载\np = 'miniprogram/towxml/parse/markdown/index.js'\ns = open(p, encoding='utf-8').read()\nold = \"\"\"// 应用Markdown解析扩展，包括自定义组件（['sub','sup','ins','mark','emoji','todo','latex','yuml','echarts']）\n// [...config.markdown,...config.components].forEach(item => {\n//     if(!/^audio-player|table|todogroup|img$/.test(item)){\n//         md.use(require(`./plugins/${item}`));\n//     };\n// });\n//@regMarkdownPlugins\"\"\"\nnew = \"\"\"// 应用Markdown解析扩展（源码版手动启用，构建版由 //@regMarkdownPlugins 替换）\n[...config.markdown, ...config.components].forEach(item => {\n    if (!/^audio-player|table|todogroup|img$/.test(item)) {\n        try {\n            md.use(require(`./plugins/${item}`));\n        } catch (e) {\n            console.warn('[towxml] 插件加载失败:', item, e.message);\n        }\n    }\n});\"\"\"\nassert old in s, '未找到插件加载注释'\ns = s.replace(old, new)\nopen(p, 'w', encoding='utf-8').write(s)\nprint('markdown/index.js 已启用插件')\nPYEOF\necho \"=== node 测试 markdown+latex ===\" && node -e \"\nconst md = require('./miniprogram/towxml/parse/markdown/index.js');\ntry {\n  const html = md('# 标题\\n\\n公式 \\$x^2-4=0\\$ 的解是 \\$x=\\\\\\\\pm 2\\$\\n\\n- 列表项');\n  console.log('✅ mark